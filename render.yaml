services:
  - type: web
    name: sonic-jam-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # You will paste your Neon URL here in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
